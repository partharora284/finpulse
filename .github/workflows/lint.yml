name: Lint

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  lint:
    name: flake8 & black (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black

      - name: Install service dependencies (for import-aware linting)
        run: |
          pip install -r ingestor/requirements.txt
          pip install -r dashboard/requirements.txt

      - name: Run black (check only)
        run: black --check --diff ingestor dashboard

      - name: Run flake8
        run: |
          flake8 ingestor dashboard \
            --max-line-length=100 \
            --extend-ignore=E203,W503 \
            --statistics
